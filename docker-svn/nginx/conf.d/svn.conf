server {
    listen 80;
    server_name localhost;  # 替换为你的域名

    # 将所有 HTTP 请求重定向到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name localhost;  # 替换为你的域名

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/cert.pem;   # 容器内证书路径
    ssl_certificate_key /etc/nginx/ssl/key.pem; # 容器内私钥路径

    # 推荐的 SSL 配置 (增强安全性)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 代理 SVN 服务和 SVNAdmin 后台管理界面
    location / {
        # 将请求转发到名为 'svn-server' 的容器的 80 端口
        proxy_pass http://svn-server:80;

        # 传递真实的请求信息给后端服务
        proxy_set_header Host $host;                 # 传递原始请求的 Host 头
        proxy_set_header X-Real-IP $remote_addr;     # 传递客户端真实 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 传递完整代理链 IP
        proxy_set_header X-Forwarded-Proto $scheme;  # 传递原始请求协议

        # 可选：增加超时设置，防止大文件上传或操作耗时过长
        proxy_connect_timeout 3600;
        proxy_send_timeout 3600;
        proxy_read_timeout 3600;
    }
}