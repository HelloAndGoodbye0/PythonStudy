version: "3"

networks:
  gitea:
    external: false

services:
  server:
    image: docker.gitea.com/gitea:28.4.0
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - TZ=Asia/Shanghai
    restart: always
    networks:
      - gitea
    volumes:
      - ./data:/data
    ports:
      - "8001:3000"
      - "22:22"