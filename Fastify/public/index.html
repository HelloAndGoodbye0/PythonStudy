<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室 - Chat Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            height: 600px;
            width: 100%;
            max-width: 900px;
            overflow: hidden;
        }

        /* 登录面板 */
        .login-panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.3s;
        }

        .login-panel.hidden {
            display: none;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 300px;
        }

        .login-box h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .login-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-box button:hover {
            background: #5568d3;
        }

        /* 左侧用户列表 */
        .sidebar {
            width: 200px;
            background: #f5f5f5;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 15px;
            background: #667eea;
            color: white;
            font-weight: bold;
            border-bottom: 1px solid #e0e0e0;
        }

        .users-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .user-item {
            padding: 10px;
            margin-bottom: 5px;
            background: white;
            border-radius: 5px;
            font-size: 13px;
            color: #333;
            border-left: 3px solid #667eea;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-item.me {
            background: #e8eaf6;
            border-left-color: #764ba2;
            font-weight: bold;
        }

        /* 右侧聊天区域 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px;
            background: #667eea;
            color: white;
            font-weight: bold;
            border-bottom: 1px solid #e0e0e0;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.system {
            text-align: center;
            color: #999;
            font-size: 12px;
            padding: 10px;
        }

        .message.own {
            display: flex;
            justify-content: flex-end;
        }

        .message.other {
            display: flex;
            justify-content: flex-start;
        }

        .message-content {
            max-width: 60%;
            padding: 10px 15px;
            border-radius: 8px;
            word-break: break-word;
            font-size: 14px;
        }

        .message.own .message-content {
            background: #667eea;
            color: white;
        }

        .message.other .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .message-meta {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            padding: 0 10px;
        }

        .message.other .message-meta {
            text-align: left;
        }

        .message.own .message-meta {
            text-align: right;
        }

        /* 输入区域 */
        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-area button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
        }

        .input-area button:hover {
            background: #5568d3;
        }

        .input-area button:active {
            transform: scale(0.98);
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f0f0f0;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: 150px;
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
            }

            .messages-container {
                padding: 15px;
            }

            .message-content {
                max-width: 80%;
            }
        }
    </style>
</head>
<body>
    <!-- 登录面板 -->
    <div id="loginPanel" class="login-panel">
        <div class="login-box">
            <h1>欢迎加入聊天室</h1>
            <input 
                type="text" 
                id="usernameInput" 
                placeholder="请输入您的昵称" 
                autocomplete="off"
            >
            <button onclick="joinChat()">进入聊天室</button>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="container" style="display: none;" id="chatContainer">
        <!-- 左侧用户列表 -->
        <div class="sidebar">
            <div class="sidebar-header">在线用户 (<span id="userCount">0</span>)</div>
            <div class="users-list" id="usersList"></div>
        </div>

        <!-- 右侧聊天区域 -->
        <div class="chat-area">
            <div class="chat-header">聊天室</div>
            <div class="messages-container" id="messagesContainer"></div>
            <div class="input-area">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="输入消息..." 
                    autocomplete="off"
                    onkeypress="handleKeyPress(event)"
                >
                <button onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let currentUsername = '';

        function joinChat() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                alert('请输入用户名');
                return;
            }

            // 连接到 WebSocket
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                currentUsername = username;
                console.log('WebSocket 已连接');
                
                // 发送加入消息
                socket.send(JSON.stringify({
                    type: 'join',
                    username: username
                }));

                // 隐藏登录面板
                document.getElementById('loginPanel').classList.add('hidden');
                document.getElementById('chatContainer').style.display = 'flex';
                document.getElementById('messageInput').focus();
            };

            socket.onmessage = (event) => {
                const message = JSON.parse(event.data);
                handleMessage(message);
            };

            socket.onerror = (error) => {
                console.error('WebSocket 错误:', error);
                alert('连接出错，请刷新页面重试');
            };

            socket.onclose = () => {
                console.log('WebSocket 已断开');
                alert('连接已断开');
                window.location.reload();
            };
        }

        function handleMessage(message) {
            const container = document.getElementById('messagesContainer');
            console.log('收到消息:', message);
            if (message.type === 'join') {
                // 用户加入消息
                addMessage(null, null, `${message.username} 加入了聊天室`, true);
            } else if (message.type === 'message') {
                // 聊天消息
                const isOwn = message.username === currentUsername;
                addMessage(message.username, message.content, null, false, isOwn);
            } else if (message.type === 'leave') {
                // 用户离开消息
                addMessage(null, null, `${message.username} 离开了聊天室`, true);
            } else if (message.type === 'users-list') {
                // 用户列表
                updateUsersList(message.users);
            }

            // 自动滚动到底部
            container.scrollTop = container.scrollHeight;
        }

        function addMessage(username, content, systemText, isSystem = false, isOwn = false) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');

            if (isSystem) {
                messageDiv.className = 'message system';
                messageDiv.textContent = systemText;
            } else {
                messageDiv.className = `message ${isOwn ? 'own' : 'other'}`;
                
                const contentDiv = document.createElement('div');
                const contentSpan = document.createElement('span');
                contentSpan.className = 'message-content';
                contentSpan.textContent = content;
                contentDiv.appendChild(contentSpan);

                const metaDiv = document.createElement('div');
                metaDiv.className = 'message-meta';
                metaDiv.textContent = `${username} ${formatTime(new Date())}`;
                contentDiv.appendChild(metaDiv);

                messageDiv.appendChild(contentDiv);
            }

            container.appendChild(messageDiv);
        }

        function updateUsersList(users) {
            const usersList = document.getElementById('usersList');
            const userCount = document.getElementById('userCount');

            usersList.innerHTML = '';
            userCount.textContent = users.length;

            users.forEach(user => {
                const userItem = document.createElement('div');
                userItem.className = 'user-item' + (user === currentUsername ? ' me' : '');
                userItem.title = user;
                userItem.textContent = (user === currentUsername ? '[你] ' : '') + user;
                usersList.appendChild(userItem);
            });
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            socket.send(JSON.stringify({
                type: 'message',
                content: message
            }));

            input.value = '';
            input.focus();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function formatTime(date) {
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        // 回车聚焦
        document.getElementById('usernameInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                joinChat();
            }
        });
    </script>
</body>
</html>
