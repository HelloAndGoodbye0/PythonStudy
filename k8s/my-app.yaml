#namespce
apiVersion: v1           # Kubernetes API 版本，v1 是稳定版本
kind: Namespace         # 资源类型：命名空间
metadata:               # 元数据部分
  name: nginx-app       # 命名空间名称，其他资源通过 namespace: nginx-app 引用
  labels:               # 标签，用于资源分类和选择
    app: my-app          # 标签键值对，标识这是 nginx 应用相关的资源

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: nginx-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---

#Services
apiVersion: v1
kind: Service
metadata:
  name: my-app-service
  namespace: nginx-app
spec:
  type: NodePort
  selector:
    app: my-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30001

