# ============================================
# Service 配置
# 作用：为 Pod 提供稳定的网络访问入口，实现负载均衡和服务发现
# 功能：将流量分发到匹配的 Pod，即使 Pod IP 变化也能保持访问
# ============================================
apiVersion: v1              # API 版本，Service 属于核心 API
kind: Service               # 资源类型：服务
metadata:                   # 元数据部分
  name: nginx-service       # Service 名称，其他服务可通过此名称访问
  namespace: nginx-app      # 所属命名空间，与 Deployment 保持一致
  labels:                   # 标签
    app: nginx              # 标识这是 nginx 相关的服务

spec:                       # 规格说明
  type: NodePort            # Service 类型：NodePort（节点端口）
                            # 其他类型：ClusterIP（集群内访问）、LoadBalancer（云负载均衡器）

  # --- 端口配置 ---
  ports:
    - name: http            # 端口名称
      port: 80              # Service 暴露的端口（集群内部访问用）
      targetPort: 80        # 转发到 Pod 的容器端口（与 containerPort 对应）
      nodePort: 30080       # 节点上暴露的端口（范围 30000-32767）
                            # 可通过 <节点IP>:30080 从集群外部访问

  # --- 选择器 ---
  selector:                 # 标签选择器，决定流量转发给哪些 Pod
    app: nginx              # 只转发给带有 app=nginx 标签的 Pod
                            # 必须与 Deployment 中 Pod 的 labels 匹配
