# ============================================
# 命名空间配置 (Namespace)
# 作用：创建一个独立的逻辑隔离空间，用于存放 nginx 相关的所有资源
# 类似于虚拟文件夹，将不同应用的资源分开管理
# ============================================
apiVersion: v1           # Kubernetes API 版本，v1 是稳定版本
kind: Namespace         # 资源类型：命名空间
metadata:               # 元数据部分
  name: nginx-app       # 命名空间名称，其他资源通过 namespace: nginx-app 引用
  labels:               # 标签，用于资源分类和选择
    app: nginx          # 标签键值对，标识这是 nginx 应用相关的资源
